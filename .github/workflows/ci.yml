name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate front matter and cross-references
        run: python scripts/validate.py
      - name: Generated blocks are up to date
        run: python scripts/build_indexes.py --check
      - name: Script tests
        run: python -m pytest -q
      - name: Site builds with no broken links
        run: mkdocs build --strict
